name: DEV and PROD - Verify release artifact
run-name: >-
  ${{ inputs.target == 'prod' && 'PROD' || 'DEV' }} | ${{ inputs.package_run_id != '' && 'Verify release artifact (no publish)' || 'Verify release source and CI (no publish)' }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full source master SHA
        required: true
        type: string
      package_run_id:
        description: Source package workflow run ID, for read-only artifact rehearsal
        type: string
        required: false
      target:
        description: Expected package target
        type: choice
        options: [dev, prod]
        default: dev
      public_probe:
        description: Permit the public-source rehearsal
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-release-source
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository_id == '1469367994' && github.ref == 'refs/heads/master' && github.actor_id == '33728924'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: source-read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify immutable source and finished CI
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          PUBLIC_PROBE: ${{ inputs.public_probe }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: node scripts/verify-source.mjs
      - name: Verify SHA, download private release artifact and validate every file without deploying
        if: inputs.package_run_id != ''
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TARGET: ${{ inputs.target }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: node scripts/download-verified-release.mjs
