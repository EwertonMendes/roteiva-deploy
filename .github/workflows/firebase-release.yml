name: Verify Firebase release identity
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/firebase-release.yml'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      operation:
        description: Identity check or protected DEV/PROD publication
        type: choice
        required: true
        default: verify
        options: [verify, release]
      sha:
        description: Full source master SHA (release only)
        type: string
      package_run_id:
        description: Source packaging workflow run ID (release only)
        type: string
      confirmation:
        description: Type DEPLOY ROTEIVA PROD for production
        type: string
      frontend_only:
        type: boolean
        default: false
      domain_cutover:
        type: boolean
        default: false
      billing_schema:
        type: boolean
        default: false
      target:
        description: Verify permissions without publishing
        type: choice
        required: true
        options: [development, production]
permissions: {}
concurrency:
  group: firebase-release-identity-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node --test scripts/*.test.mjs
  verify:
    if: >-
      github.repository_id == '1469367994' && github.ref == 'refs/heads/master' &&
      github.actor_id == '33728924' && inputs.operation != 'release' && contains(fromJSON('["development","production"]'), inputs.target)
    runs-on: ubuntu-latest
    environment: firebase-${{ inputs.target }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: identity
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify project boundaries and deployment permissions
        env:
          ACCESS_TOKEN: ${{ steps.identity.outputs.access_token }}
          TARGET: ${{ inputs.target }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node scripts/verify-firebase-identity.mjs


  preflight:
    name: Verify immutable master SHA, CI and artifact provenance
    if: >-
      github.repository_id == '1469367994' && github.ref == 'refs/heads/master' &&
      github.actor_id == '33728924' && inputs.operation == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: source-read
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Guard target and manually approved options
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          TARGET: ${{ inputs.target }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
          DOMAIN_CUTOVER: ${{ inputs.domain_cutover }}
          BILLING_SCHEMA: ${{ inputs.billing_schema }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [ "$TARGET" = production ]; then test "$CONFIRMATION" = 'DEPLOY ROTEIVA PROD'; fi
          if [ "$FRONTEND_ONLY" = true ]; then
            test "$DOMAIN_CUTOVER" != true
            test "$BILLING_SCHEMA" != true
          fi
          if [ "$TARGET" = development ]; then
            test "$DOMAIN_CUTOVER" != true
            test "$BILLING_SCHEMA" != true
          fi
      - name: Verify the private source, merged PR, release checks and exact artifact
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          RELEASE_SHA: ${{ inputs.sha }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          RELEASE_TARGET: ${{ inputs.target == 'production' && 'prod' || 'dev' }}
        run: node scripts/verify-release-package.mjs

  worker:
    name: Publish Cloudflare Worker and D1 (protected)
    needs: preflight
    if: needs.preflight.result == 'success' && !inputs.frontend_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-${{ inputs.target }}
    permissions:
      contents: read
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      RELEASE_SHA: ${{ inputs.sha }}
      PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      RELEASE_TARGET: ${{ inputs.target == 'production' && 'prod' || 'dev' }}
      DOMAIN_CUTOVER: ${{ inputs.domain_cutover }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      PRODUCTION_BILLING_ENABLED: ${{ vars.PRODUCTION_BILLING_ENABLED }}
      PRODUCTION_BILLING_CHECKOUT_ENABLED: ${{ vars.PRODUCTION_BILLING_CHECKOUT_ENABLED }}
      PRODUCTION_BILLING_PIX_ENABLED: ${{ vars.PRODUCTION_BILLING_PIX_ENABLED }}
      PRODUCTION_BILLING_PUBLIC_ROLLOUT_ENABLED: ${{ vars.PRODUCTION_BILLING_PUBLIC_ROLLOUT_ENABLED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download source-only artifact and validate SHA-256 after approval
        id: bundle
        run: node scripts/download-verified-release.mjs
      - name: Install locked Wrangler runtime without install scripts
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate destination, token scope, secrets and pending migrations
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        env:
          BILLING_SCHEMA: ${{ inputs.billing_schema }}
        run: |
          set -euo pipefail
          node scripts/guard-environment.mjs "$RELEASE_TARGET" --before-migrations
          node scripts/guard-token-scope.mjs "$RELEASE_TARGET"
          node scripts/guard-secrets.mjs "$RELEASE_TARGET"
          if [ "$DOMAIN_CUTOVER" = true ]; then
            node scripts/guard-migrations.mjs "$RELEASE_TARGET" --domain-cutover
            node ../scripts/verify-domain-app.mjs --before-deploy
          elif [ "$BILLING_SCHEMA" = true ]; then
            node scripts/guard-migrations.mjs "$RELEASE_TARGET" --billing-schema
          else
            node scripts/guard-migrations.mjs "$RELEASE_TARGET"
          fi
      - name: Apply reviewed D1 migrations and seal database identity
        if: ${{ !inputs.domain_cutover }}
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        run: |
          set -euo pipefail
          npm run "migrate:$RELEASE_TARGET"
          node scripts/guard-environment.mjs "$RELEASE_TARGET" --seal
      - name: Deploy prebuilt Worker without re-uploading runtime secrets
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        run: |
          set -euo pipefail
          if [ "$DOMAIN_CUTOVER" = true ]; then
            expires="$(date -u -d '+24 hours' '+%Y-%m-%dT%H:%M:%SZ')"
            ./node_modules/.bin/wrangler deploy worker.js --no-bundle --env "$RELEASE_TARGET" --config wrangler.jsonc --var "LEGACY_FRONTEND_UNTIL:$expires"
          else
            ./node_modules/.bin/wrangler deploy worker.js --no-bundle --env "$RELEASE_TARGET" --config wrangler.jsonc
          fi
      - name: Smoke test Worker and enforce successful backend before Firebase
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        run: |
          node scripts/guard-secrets.mjs "$RELEASE_TARGET"
          node ../scripts/smoke-environment.mjs "$RELEASE_TARGET"

  firebase:
    name: Publish Firebase Hosting and Firestore (protected OIDC)
    needs: [preflight, worker]
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      (needs.worker.result == 'success' || (inputs.frontend_only && needs.worker.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-${{ inputs.target }}
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
      RELEASE_SHA: ${{ inputs.sha }}
      PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      RELEASE_TARGET: ${{ inputs.target == 'production' && 'prod' || 'dev' }}
      DOMAIN_CUTOVER: ${{ inputs.domain_cutover }}
      PRODUCTION_BILLING_ENABLED: ${{ vars.PRODUCTION_BILLING_ENABLED }}
      PRODUCTION_BILLING_CHECKOUT_ENABLED: ${{ vars.PRODUCTION_BILLING_CHECKOUT_ENABLED }}
      PRODUCTION_BILLING_PIX_ENABLED: ${{ vars.PRODUCTION_BILLING_PIX_ENABLED }}
      PRODUCTION_BILLING_PUBLIC_ROLLOUT_ENABLED: ${{ vars.PRODUCTION_BILLING_PUBLIC_ROLLOUT_ENABLED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release source again after approval and unpack immutable artifact
        id: bundle
        run: node scripts/download-verified-release.mjs
      - name: Reject cross-environment Firebase publication
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = "roteiva-web-$RELEASE_TARGET"
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync(process.argv[1]));if(m.projectId!==process.env.FIREBASE_PROJECT_ID)process.exit(1)" "${{ steps.bundle.outputs.release_path }}/release-manifest.json"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: identity
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify OIDC trust and Firebase environment boundaries
        env:
          ACCESS_TOKEN: ${{ steps.identity.outputs.access_token }}
          TARGET: ${{ inputs.target }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node scripts/verify-firebase-identity.mjs
      - name: Install pinned Firebase CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund firebase-tools@15.34.0
      - name: Deploy Hosting and optionally reviewed Firestore rules/indexes
        working-directory: ${{ steps.bundle.outputs.release_path }}
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
        run: |
          set -euo pipefail
          if [ "$FRONTEND_ONLY" = true ] || [ "$DOMAIN_CUTOVER" = true ]; then
            if [ "$RELEASE_TARGET" = dev ]; then only="hosting"; else only="hosting:roteiva-web-prod"; fi
          elif [ "$RELEASE_TARGET" = prod ]; then
            only="firestore:rules,firestore:indexes,hosting:roteiva-web-prod"
          else
            only="firestore:rules,firestore:indexes,hosting"
          fi
          firebase deploy --config firebase.json --only "$only" --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Smoke-check deployed domain, auth handler and Worker
        working-directory: ${{ steps.bundle.outputs.release_path }}
        env:
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TARGET" = prod ]; then
            node scripts/verify-hosting-cache.mjs https://app.roteiva.com
            node scripts/verify-domain-app.mjs
          else
            node scripts/verify-hosting-cache.mjs https://roteiva-web-dev.web.app
          fi
          if [ "$FRONTEND_ONLY" != true ]; then node scripts/smoke-environment.mjs "$RELEASE_TARGET"; fi
