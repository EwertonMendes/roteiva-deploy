name: Verify Firebase release identity
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/firebase-release.yml'
      - 'scripts/**'
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Identity check or protected DEV/PROD publication
        type: choice
        required: true
        default: verify
        options: [verify, release, auto-dev, preview, site, observability, qa-infra]
      pr_number:
        description: Optional same-repository PR number (DEV only)
        required: false
        type: string
      worker_only:
        description: Publish Worker and D1 only (DEV only)
        type: boolean
        default: false
      firestore_only:
        description: Publish Firestore rules and indexes only (DEV only)
        type: boolean
        default: false
      sha:
        description: Full source SHA (release only)
        type: string
      package_run_id:
        description: Source packaging workflow run ID (release only)
        type: string
      confirmation:
        description: Type DEPLOY ROTEIVA PROD for production
        type: string
      frontend_only:
        type: boolean
        default: false
      domain_cutover:
        type: boolean
        default: false
      billing_schema:
        type: boolean
        default: false
      target:
        description: Verify permissions without publishing
        type: choice
        required: true
        options: [development, production]
permissions: {}
concurrency:
  group: firebase-release-identity-${{ inputs.target || 'development' }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node --test scripts/*.test.mjs
  verify:
    if: >-
      github.repository_id == '1469367994' && github.ref == 'refs/heads/master' &&
      github.actor_id == '33728924' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify' && contains(fromJSON('["development","production"]'), inputs.target)
    runs-on: ubuntu-latest
    environment: firebase-${{ inputs.target }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: identity
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify project boundaries and deployment permissions
        env:
          ACCESS_TOKEN: ${{ steps.identity.outputs.access_token }}
          TARGET: ${{ inputs.target }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node scripts/verify-firebase-identity.mjs


  preflight:
    name: Verify immutable master SHA, CI and artifact provenance
    if: >-
      github.repository_id == '1469367994' && github.ref == 'refs/heads/master' &&
      github.actor_id == '33728924' &&
      (github.event_name == 'schedule' || inputs.operation == 'release' || inputs.operation == 'site' || inputs.operation == 'preview' || inputs.operation == 'observability' || inputs.operation == 'qa-infra' || (inputs.operation == 'auto-dev' && inputs.target == 'development'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: source-read
    outputs:
      ready: ${{ steps.selection.outputs.ready || steps.manual.outputs.ready }}
      sha: ${{ steps.selection.outputs.sha || steps.manual.outputs.sha }}
      package_run: ${{ steps.selection.outputs.package_run || steps.manual.outputs.package_run }}
      receipt_id: ${{ steps.receipt.outputs.id }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reject incompatible automatic release flags
        if: github.event_name == 'schedule' || inputs.operation == 'auto-dev'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
          WORKER_ONLY: ${{ inputs.worker_only }}
          FIRESTORE_ONLY: ${{ inputs.firestore_only }}
          DOMAIN_CUTOVER: ${{ inputs.domain_cutover }}
          BILLING_SCHEMA: ${{ inputs.billing_schema }}
        run: |
          set -euo pipefail
          test -z "$PR_NUMBER"
          for flag in "$FRONTEND_ONLY" "$WORKER_ONLY" "$FIRESTORE_ONLY" "$DOMAIN_CUTOVER" "$BILLING_SCHEMA"; do test "$flag" != true; done
      - name: Discover completed current DEV package (no dispatch credential)
        id: selection
        if: github.event_name == 'schedule' || inputs.operation == 'auto-dev'
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          MANUAL_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
          CONTROLLER_RECEIPT_TOKEN: ${{ github.token }}
        run: node scripts/select-dev-release.mjs
      - name: Guard target and manually approved options
        if: contains(fromJSON('["release","preview","site","observability","qa-infra"]'), inputs.operation)
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          TARGET: ${{ inputs.target }}
          OPERATION: ${{ inputs.operation }}
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKER_ONLY: ${{ inputs.worker_only }}
          FIRESTORE_ONLY: ${{ inputs.firestore_only }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
          DOMAIN_CUTOVER: ${{ inputs.domain_cutover }}
          BILLING_SCHEMA: ${{ inputs.billing_schema }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          partial=0
          for flag in "$FRONTEND_ONLY" "$WORKER_ONLY" "$FIRESTORE_ONLY"; do
            if [ "$flag" = true ]; then partial=$((partial+1)); fi
          done
          test "$partial" -le 1
          if [ "$TARGET" = production ]; then
            test -z "$PR_NUMBER"
            test "$WORKER_ONLY" != true
            test "$FIRESTORE_ONLY" != true
            if [ "$OPERATION" = site ] || [ "$OPERATION" = observability ]; then
              if [ "$OPERATION" = site ]; then test "$CONFIRMATION" = 'DEPLOY ROTEIVA SITE'; else test "$CONFIRMATION" = 'APLICAR REDACAO PROD'; fi
              test "$partial" -eq 0
              test "$DOMAIN_CUTOVER" != true
              test "$BILLING_SCHEMA" != true
            else
              test "$OPERATION" = release
              test "$CONFIRMATION" = 'DEPLOY ROTEIVA PROD'
            fi
          else
            test "$TARGET" = development
            test "$OPERATION" != site
            test "$OPERATION" != observability
            test "$DOMAIN_CUTOVER" != true
            test "$BILLING_SCHEMA" != true
            if [ -n "$PR_NUMBER" ]; then
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
              test "$CONFIRMATION" = 'PUBLICAR_PR_DEV'
            fi
            if [ "$OPERATION" = qa-infra ]; then
              test -z "$PR_NUMBER"
              test "$partial" -eq 0
            fi
            if [ "$OPERATION" = preview ]; then
              test -n "$PR_NUMBER"
              test "$partial" -eq 0
            fi
          fi
          if [ "$FRONTEND_ONLY" = true ]; then
            test "$DOMAIN_CUTOVER" != true
            test "$BILLING_SCHEMA" != true
          fi
      - name: Verify the private source, merged PR, release checks and exact artifact
        id: manual
        if: contains(fromJSON('["release","preview","site","observability","qa-infra"]'), inputs.operation)
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          RELEASE_SHA: ${{ inputs.sha }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RELEASE_TARGET: ${{ inputs.target == 'production' && 'prod' || 'dev' }}
        run: |
          node scripts/verify-release-package.mjs
          echo ready=true >> "$GITHUB_OUTPUT"
      - name: Record durable DEV master release attempt (no cloud credentials)
        id: receipt
        if: >-
          (steps.selection.outputs.ready == 'true' || steps.manual.outputs.ready == 'true') &&
          (github.event_name == 'schedule' || inputs.operation == 'auto-dev' ||
           (inputs.operation == 'release' && inputs.target == 'development' && inputs.pr_number == '' &&
            !inputs.frontend_only && !inputs.worker_only && !inputs.firestore_only))
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.selection.outputs.sha || steps.manual.outputs.sha }}
          PACKAGE_RUN: ${{ steps.selection.outputs.package_run || steps.manual.outputs.package_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ ]]
          id="$(jq -n --arg ref "$GITHUB_SHA" --arg sha "$SOURCE_SHA" --arg run "$PACKAGE_RUN" '
            {ref:$ref,environment:"roteiva-dev-release-receipts",task:"roteiva-dev-release",auto_merge:false,
             required_contexts:[],production_environment:false,transient_environment:true,
             payload:{source_sha:$sha,package_run_id:$run}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          [[ "$id" =~ ^[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress -f description="Verified DEV master release" >/dev/null
          echo "id=$id" >> "$GITHUB_OUTPUT"

  worker:
    name: Publish Cloudflare Worker and D1 (protected)
    needs: preflight
    if: >-
      needs.preflight.result == 'success' && needs.preflight.outputs.ready == 'true' &&
      !inputs.frontend_only && !inputs.firestore_only && inputs.operation != 'site' && inputs.operation != 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-${{ inputs.target || 'development' }}
    permissions:
      contents: read
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      PACKAGE_RUN_ID: ${{ needs.preflight.outputs.package_run }}
      PR_NUMBER: ${{ inputs.pr_number }}
      RELEASE_TARGET: ${{ inputs.target == 'production' && 'prod' || 'dev' }}
      DOMAIN_CUTOVER: ${{ inputs.domain_cutover }}
      OPERATION: ${{ inputs.operation }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      PRODUCTION_BILLING_ENABLED: ${{ vars.PRODUCTION_BILLING_ENABLED }}
      PRODUCTION_BILLING_CHECKOUT_ENABLED: ${{ vars.PRODUCTION_BILLING_CHECKOUT_ENABLED }}
      PRODUCTION_BILLING_PIX_ENABLED: ${{ vars.PRODUCTION_BILLING_PIX_ENABLED }}
      PRODUCTION_BILLING_PUBLIC_ROLLOUT_ENABLED: ${{ vars.PRODUCTION_BILLING_PUBLIC_ROLLOUT_ENABLED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download source-only artifact and validate SHA-256 after approval
        id: bundle
        run: node scripts/download-verified-release.mjs
      - name: Install locked Wrangler runtime without install scripts
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply only reviewed production log redaction (no deployment or database change)
        if: inputs.operation == 'observability'
        working-directory: ${{ steps.bundle.outputs.release_path }}
        run: node api/scripts/apply-worker-log-redaction.mjs
      - name: Read-only live DEV infrastructure QA
        if: inputs.operation == 'qa-infra'
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        run: |
          node scripts/guard-environment.mjs dev
          node scripts/guard-token-scope.mjs dev
          node scripts/qa-free-tier-live.mjs
      - name: Validate destination, token scope, secrets and pending migrations
        if: inputs.operation != 'observability' && inputs.operation != 'qa-infra'
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        env:
          BILLING_SCHEMA: ${{ inputs.billing_schema }}
        run: |
          set -euo pipefail
          node scripts/guard-environment.mjs "$RELEASE_TARGET" --before-migrations
          node scripts/guard-token-scope.mjs "$RELEASE_TARGET"
          node scripts/guard-secrets.mjs "$RELEASE_TARGET"
          if [ "$DOMAIN_CUTOVER" = true ]; then
            node scripts/guard-migrations.mjs "$RELEASE_TARGET" --domain-cutover
            node ../scripts/verify-domain-app.mjs --before-deploy
          elif [ "$BILLING_SCHEMA" = true ]; then
            node scripts/guard-migrations.mjs "$RELEASE_TARGET" --billing-schema
          else
            node scripts/guard-migrations.mjs "$RELEASE_TARGET"
          fi
      - name: Apply reviewed D1 migrations and seal database identity
        if: ${{ !inputs.domain_cutover && inputs.operation != 'observability' && inputs.operation != 'qa-infra' }}
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        run: |
          set -euo pipefail
          npm run "migrate:$RELEASE_TARGET"
          node scripts/guard-environment.mjs "$RELEASE_TARGET" --seal
      - name: Deploy prebuilt Worker without re-uploading runtime secrets
        if: inputs.operation != 'observability' && inputs.operation != 'qa-infra'
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        run: |
          set -euo pipefail
          if [ "$DOMAIN_CUTOVER" = true ]; then
            expires="$(date -u -d '+24 hours' '+%Y-%m-%dT%H:%M:%SZ')"
            ./node_modules/.bin/wrangler deploy worker.js --no-bundle --env "$RELEASE_TARGET" --config wrangler.jsonc --var "LEGACY_FRONTEND_UNTIL:$expires"
          else
            ./node_modules/.bin/wrangler deploy worker.js --no-bundle --env "$RELEASE_TARGET" --config wrangler.jsonc
          fi
      - name: Smoke test Worker and enforce successful backend before Firebase
        if: inputs.operation != 'observability' && inputs.operation != 'qa-infra'
        working-directory: ${{ steps.bundle.outputs.release_path }}/api
        run: |
          node scripts/guard-secrets.mjs "$RELEASE_TARGET"
          node ../scripts/smoke-environment.mjs "$RELEASE_TARGET"

  firebase:
    name: Publish Firebase Hosting and Firestore (protected OIDC)
    needs: [preflight, worker]
    if: >-
      !cancelled() && !inputs.worker_only && inputs.operation != 'observability' && inputs.operation != 'qa-infra' && needs.preflight.result == 'success' && needs.preflight.outputs.ready == 'true' &&
      (needs.worker.result == 'success' || ((inputs.frontend_only || inputs.firestore_only || inputs.operation == 'site' || inputs.operation == 'preview') && needs.worker.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-${{ inputs.target || 'development' }}
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      PACKAGE_RUN_ID: ${{ needs.preflight.outputs.package_run }}
      PR_NUMBER: ${{ inputs.pr_number }}
      RELEASE_TARGET: ${{ inputs.target == 'production' && 'prod' || 'dev' }}
      DOMAIN_CUTOVER: ${{ inputs.domain_cutover }}
      PRODUCTION_BILLING_ENABLED: ${{ vars.PRODUCTION_BILLING_ENABLED }}
      PRODUCTION_BILLING_CHECKOUT_ENABLED: ${{ vars.PRODUCTION_BILLING_CHECKOUT_ENABLED }}
      PRODUCTION_BILLING_PIX_ENABLED: ${{ vars.PRODUCTION_BILLING_PIX_ENABLED }}
      PRODUCTION_BILLING_PUBLIC_ROLLOUT_ENABLED: ${{ vars.PRODUCTION_BILLING_PUBLIC_ROLLOUT_ENABLED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release source again after approval and unpack immutable artifact
        id: bundle
        run: node scripts/download-verified-release.mjs
      - name: Reject cross-environment Firebase publication
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = "roteiva-web-$RELEASE_TARGET"
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync(process.argv[1]));if(m.projectId!==process.env.FIREBASE_PROJECT_ID)process.exit(1)" "${{ steps.bundle.outputs.release_path }}/release-manifest.json"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: identity
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify OIDC trust and Firebase environment boundaries
        env:
          ACCESS_TOKEN: ${{ steps.identity.outputs.access_token }}
          TARGET: ${{ inputs.target || 'development' }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node scripts/verify-firebase-identity.mjs
      - name: Install pinned Firebase CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund firebase-tools@15.34.0
      - name: Require compatible access Worker before a DEV Hosting-only release
        if: inputs.frontend_only && inputs.target == 'development'
        working-directory: ${{ steps.bundle.outputs.release_path }}
        run: node scripts/check-access-worker.mjs
      - name: Deploy Hosting and optionally reviewed Firestore rules/indexes
        working-directory: ${{ steps.bundle.outputs.release_path }}
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
          FIRESTORE_ONLY: ${{ inputs.firestore_only }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = site ]; then
            test "$RELEASE_TARGET" = prod
            firebase deploy --config firebase.site.prod.json --only hosting:roteiva-site-prod --project "$FIREBASE_PROJECT_ID" --non-interactive
            exit 0
          fi
          if [ "$OPERATION" = preview ]; then
            test "$RELEASE_TARGET" = dev
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
            firebase hosting:channel:deploy "pr-$PR_NUMBER" --config firebase.json --project "$FIREBASE_PROJECT_ID" --expires 7d --non-interactive
            exit 0
          fi
          if [ "$FIRESTORE_ONLY" = true ]; then
            only='firestore:rules,firestore:indexes'
          elif [ "$FRONTEND_ONLY" = true ] || [ "$DOMAIN_CUTOVER" = true ]; then
            if [ "$RELEASE_TARGET" = dev ]; then only="hosting"; else only="hosting:roteiva-web-prod"; fi
          elif [ "$RELEASE_TARGET" = prod ]; then
            only="firestore:rules,firestore:indexes,hosting:roteiva-web-prod"
          else
            only="firestore:rules,firestore:indexes,hosting"
          fi
          firebase deploy --config firebase.json --only "$only" --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Smoke-check deployed domain, auth handler and Worker
        working-directory: ${{ steps.bundle.outputs.release_path }}
        env:
          FRONTEND_ONLY: ${{ inputs.frontend_only }}
          FIRESTORE_ONLY: ${{ inputs.firestore_only }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = site ]; then
            node scripts/verify-institutional-hosting.mjs https://roteiva-site-prod.web.app
            exit 0
          fi
          if [ "$OPERATION" = preview ] || [ "$FIRESTORE_ONLY" = true ]; then exit 0; fi
          if [ "$RELEASE_TARGET" = prod ]; then
            node scripts/verify-hosting-cache.mjs https://app.roteiva.com
            node scripts/verify-domain-app.mjs
          else
            node scripts/verify-hosting-cache.mjs https://roteiva-web-dev.web.app
          fi
          if [ "$FRONTEND_ONLY" != true ]; then node scripts/smoke-environment.mjs "$RELEASE_TARGET"; fi

  receipt:
    name: Finalize DEV release receipt
    needs: [preflight, worker, firebase]
    if: always() && needs.preflight.outputs.receipt_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      deployments: write
    steps:
      - name: Persist success or failure without touching cloud services
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ID: ${{ needs.preflight.outputs.receipt_id }}
          WORKER: ${{ needs.worker.result }}
          FIREBASE: ${{ needs.firebase.result }}
        run: |
          set -euo pipefail
          [[ "$RECEIPT_ID" =~ ^[0-9]+$ ]]
          state=failure
          if [ "$WORKER" = success ] && [ "$FIREBASE" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$RECEIPT_ID/statuses" -f state="$state" -f description="DEV release $state" >/dev/null
